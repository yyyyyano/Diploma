# Рабочие пакеты монорепозитория (docs/ARCHITECTURE.md §2). Папки появляются задачами плана.
packages:
  - apps/*
  - packages/*
  - tooling/synth
  - e2e

# Единые версии для всех пакетов: в package.json пишется "<пакет>": "catalog:" (ADR-0001).
catalog:
  # HTTP (ADR-0005): Hono — оболочка и два слушателя; oRPC — все пакеты строго одной версии с @orpc/contract.
  "@axe-core/playwright": 4.14.0
  # ИИ (ADR-0009): Vercel AI SDK 7 — точные версии одной линейки (ai и @ai-sdk/* выходят вместе); обновление —
  # отдельной задачей со сверкой документации node_modules/ai/docs.
  # Провайдеры (T-023): Groq и OpenAI-совместимый (Z.ai, llama-server) — на той же линейке @ai-sdk/provider 4.0.34.
  "@ai-sdk/groq": 4.0.72
  "@ai-sdk/openai-compatible": 3.0.80
  "@ai-sdk/otel": 1.0.153
  "@ai-sdk/provider": 4.0.34
  "@ai-sdk/react": 4.0.157
  # Шрифты макета локально (DES-09): переменные начертания Onest и Literata.
  "@fontsource-variable/literata": 5.3.0
  "@fontsource-variable/onest": 5.3.1
  "@hono/node-server": 2.1.5
  # NER для маскирования (T-024): русская модель имён и адресов на onnxruntime-node (ADR-0009, дополнение T-024).
  "@huggingface/transformers": 4.3.1
  # Трассы Langfuse (ADR-0010, T-011): @langfuse/otel 6.0.2 ждёт OpenTelemetry 2.x / 0.2xx и @opentelemetry/api < 1.10 —
  # с линией 3.x / 0.300 импорт @langfuse/otel падает (research 12, §3.2). Все версии — точные, обновление вместе.
  "@langfuse/otel": 6.0.2
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/core": 2.12.0
  "@opentelemetry/exporter-trace-otlp-http": 0.223.0
  "@opentelemetry/otlp-exporter-base": 0.223.0
  "@opentelemetry/sdk-trace-base": 2.12.0
  "@opentelemetry/sdk-trace-node": 2.12.0
  # Сайт (ADR-0013): Mantine 9 — все пакеты строго одной версии.
  "@mantine/core": 9.7.3
  "@mantine/dates": 9.7.3
  "@mantine/form": 9.7.3
  "@mantine/hooks": 9.7.3
  dayjs: 1.11.23
  "@orpc/client": 1.16.1
  "@orpc/contract": 1.16.1
  "@orpc/openapi": 1.16.1
  "@orpc/openapi-client": 1.16.1
  "@orpc/server": 1.16.1
  "@orpc/tanstack-query": 1.16.1
  # e2e (make e2e): версия задаёт сборку Chromium (1.63.0 — chromium 1243); новая версия — вместе с make e2e-install.
  "@playwright/test": 1.63.0
  "@tanstack/react-query": 5.104.5
  # Маршруты сайта: router, его генератор (плагин Vite и CLI для make typecheck) — одной линейки.
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-cli": 1.167.46
  "@tanstack/router-plugin": 1.168.48
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 26.6.5
  "@types/fontkit": 2.0.9
  "@types/papaparse": 5.5.2
  "@types/pdfkit": 0.17.7
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/yauzl": 3.4.0
  "@types/yazl": 3.3.1
  "@vitejs/plugin-react": 6.1.2
  "@vitest/coverage-v8": 5.0.5
  ai: 7.0.153
  # Вход (ADR-0016): Better Auth — только ядро (email + пароль, сессии), без плагинов; точная версия.
  better-auth: 1.7.12
  # Drizzle 1.0 RC — строго одна точная версия для orm и kit: аудитор SQL опирается на порядок вызова
  # Logger.logQuery (ADR-0006); обновление — отдельная задача с прогоном канареек.
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  fast-check: 4.10.2
  # Разбор выписок (T-025): определение типа файла по содержимому (SEC-03), CSV, текст и картинки PDF.
  file-type: 22.2.0
  papaparse: 5.7.0
  unpdf: 1.9.1
  # Распознавание чека (T-027): HEIC снимков iPhone → пиксели (sharp HEVC не читает) и QR с УИ локально, .wasm — с диска.
  heic-decode: 2.1.0
  zxing-wasm: 3.1.6
  # Загрузчик законов pravo.by (T-034, ADR-0012): разбор HTML (cheerio) и проверка адресов по robots.txt с шаблонами `*`.
  cheerio: 1.2.0
  robots-parser: 3.0.1
  # Нечёткое сравнение названий контрагентов и товаров в приложении (ADR-0012; в БД — pg_trgm), T-020.
  fuzzball: 2.2.6
  # Подсчёт токенов o200k_base в тесте размера префикса агента (T-010) — только dev.
  gpt-tokenizer: 4.1.0
  hono: 4.13.13
  i18next: 26.5.7
  jsdom: 30.1.3
  # Генератор синтетических выписок tooling/synth (T-025) — только dev: PDF, кириллический TTF и контуры букв для сканов.
  dejavu-fonts-ttf: 2.37.3
  fontkit: 2.0.4
  pdfkit: 0.20.2
  # Парсер PostgreSQL 18 (WASM) для аудитора SQL — точная версия, обновление с прогоном канареек (ADR-0019).
  libpg-query: 18.2.0
  lucide-react: 1.61.0
  msw: 3.0.3
  # Почта (ADR-0016, T-012): SMTP-клиент без зависимостей, свои типы; импортируется только в mail/infrastructure.
  nodemailer: 10.0.10
  pg: 8.23.1
  # Перекодирование изображений без метаданных перед облаком (PRIV-04, T-024).
  sharp: 0.35.5
  # Очередь задач на той же базе (ADR-0008) — точная версия; импортируется только в platform/jobs.
  pg-boss: 12.38.0
  # Логи (ADR-0010): pino + pino-roll как поток в процессе (ротация), pino-pretty — чтение в make logs.
  pino: 10.4.0
  pino-pretty: 13.2.0
  pino-roll: 4.0.0
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 17.1.8
  # Сборка сервера для образа (ADR-0015, T-011): точки входа → один .mjs на каждую, workspace-пакеты внутри,
  # npm-зависимости — из node_modules рядом.
  tsdown: 0.23.2
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  # Архив «Мои данные» (PRIV-05, ADR-0012): потоковая запись ZIP без лишних зависимостей; чтение — только в тестах.
  yauzl: 3.4.0
  yazl: 3.3.1
  zod: 4.6.7

# Защита цепочки поставки: не ставить версии моложе суток (ADR-0001).
minimumReleaseAge: 1440

# Пакеты, которым разрешены скрипты установки; новая нативная зависимость — новая строка (ADR-0001).
allowBuilds:
  lefthook: true
  # NER (T-024): CPU-библиотеки onnxruntime-node лежат в самом пакете; его postinstall докачивает CUDA-провайдеры
  # (+272 МБ, видеокарты NVIDIA нет), поэтому скрипт выключен; protobufjs скрипт установки не нужен.
  onnxruntime-node: false
  protobufjs: false

# dependency-cruiser 18.7 не понимает TypeScript 7 и молча проверяет 0 файлов: даём ему свой TypeScript 6
# (ADR-0002). Снимается, когда dependency-cruiser поддержит TS ≥ 7.1.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

# Одна копия @opentelemetry/api на всё дерево (T-011): глобальный TracerProvider живёт в ней, а @ai-sdk/otel требует
# ровно 1.9.1 — иначе Vitest и Drizzle (необязательный peer) тянут 1.10 и трассы уходят «в другой» провайдер. Снять,
# когда @langfuse/otel и @ai-sdk/otel примут OpenTelemetry 3.x.
overrides:
  "@opentelemetry/api": 1.9.1

patchedDependencies:
  pg-boss@12.38.0: patches/pg-boss@12.38.0.patch
