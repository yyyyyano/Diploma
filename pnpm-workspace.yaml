# Рабочие пакеты монорепозитория (docs/ARCHITECTURE.md §2). Папки появляются задачами плана.
packages:
  - apps/*
  - packages/*
  - e2e

# Единые версии для всех пакетов: в package.json пишется "<пакет>": "catalog:" (ADR-0001).
catalog:
  "@orpc/contract": 1.16.1
  "@types/node": 26.6.5
  "@types/pg": 8.23.1
  "@vitest/coverage-v8": 5.0.5
  # Drizzle 1.0 RC — строго одна точная версия для orm и kit: аудитор SQL опирается на порядок вызова
  # Logger.logQuery (ADR-0006); обновление — отдельная задача с прогоном канареек.
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  fast-check: 4.10.2
  i18next: 26.5.7
  # Парсер PostgreSQL 18 (WASM) для аудитора SQL — точная версия, обновление с прогоном канареек (ADR-0019).
  libpg-query: 18.2.0
  pg: 8.23.1
  # Логи (ADR-0010): pino + pino-roll как поток в процессе (ротация), pino-pretty — чтение в make logs.
  pino: 10.4.0
  pino-pretty: 13.2.0
  pino-roll: 4.0.0
  typescript: 7.0.2
  vitest: 5.0.5
  zod: 4.6.7

# Защита цепочки поставки: не ставить версии моложе суток (ADR-0001).
minimumReleaseAge: 1440

# Пакеты, которым разрешены скрипты установки; новая нативная зависимость — новая строка (ADR-0001).
allowBuilds:
  lefthook: true

# dependency-cruiser 18.7 не понимает TypeScript 7 и молча проверяет 0 файлов: даём ему свой TypeScript 6
# (ADR-0002). Снимается, когда dependency-cruiser поддержит TS ≥ 7.1.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3
